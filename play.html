<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css">
<script src="games.js"></script>
<style>
  /* Stands in for the host page around an embedded game. The iframe is the
     point here: it reproduces the constraints the player will actually run
     under on latimes.com. The hub (index.html) is a real page, not an embed. */
  html,body{height:100%;background:#fafafa}
  .page{max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  .pbar{display:flex;align-items:center;gap:10px;padding:16px 20px;flex:none}
  .back{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);
        font-size:16px;font-weight:700;padding:6px 10px 6px 4px;border-radius:8px}
  .back:hover{background:#efefef}
  .back svg{transform:scaleX(-1)}
  .frame{flex:1;min-height:0;padding:0 20px 28px}
  iframe{display:block;width:100%;height:780px;border:none;background:#fff;
         border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.10)}
  @media(max-width:720px){
    .pbar{padding:10px 12px}
    .back{font-size:15px}
    .frame{padding:0}
    iframe{height:calc(100vh - 56px);border-radius:0;box-shadow:none}
  }
</style>
</head>
<body>
<div class="page">
  <header class="pbar">
    <a class="back" href="index.html">
      <svg width="10" height="16" aria-hidden="true"><use href="icons.svg#i-chevron-lg"/></svg>
      Back to Games
    </a>
  </header>
  <div class="frame">
    <iframe id="game" allow="web-share; fullscreen" title="Puzzle"></iframe>
  </div>
</div>

<script>
/* One wrapper for every game; the roster lives in games.js.
     play.html?game=crossword              -> that game's archive
     play.html?game=crossword&p=<puzzleId> -> that puzzle
     play.html?game=editor                 -> the builder                       */
const params = new URLSearchParams(location.search);
let want = params.get('game');
let p    = params.get('p');
const d  = params.get('d');
// back-compat with the earlier ?p=archive / ?p=editor links
if (!want) { if (p === 'editor')  { want = 'editor';    p = null; }
             else if (p === 'archive') { want = 'crossword'; p = null; } }

const { id: gid, game: g } = resolveGame(want);
/* Pass our own URL down as ?canonical= so the game shares the page the reader
   is actually on, not the asset host. LAT's page must do the same. */
const canon = '&canonical=' + encodeURIComponent(location.href);
/* the game rides along to the player too: one crossword.html serves Daily,
   Midi and Mini, and it can only pick the right index if it is told which.

   Routing order: a puzzle wins; then, for a game with difficulty levels, the
   start screen until one is chosen; then the archive. `d` is what a chosen
   level looks like on the URL. */
const dq = d ? '&d=' + encodeURIComponent(d) : '';
/* Work the view out once. Both the iframe src and the document title depend on
   it, and deciding it twice is how they drift apart — the title used to say
   "… archive" while the difficulty screen was on screen. */
const view = p              ? 'puzzle'
           : (g.start && !d) ? 'start'
           : g.archive       ? 'archive'
                             : 'puzzle';
const src = view === 'puzzle' ? g.player + '?game=' + encodeURIComponent(gid) +
                                (p ? '&p=' + encodeURIComponent(p) : '') + canon
          : view === 'start'  ? g.start + '?game=' + encodeURIComponent(gid) + canon
                              : g.archive + '?game=' + encodeURIComponent(gid) + dq + canon;

const frame = document.getElementById('game');
frame.src = src;
frame.title = g.label;
document.title = view === 'archive' ? g.label + ' archive' : g.label;

/* Host side of the navigation contract. The embedded game never touches
   window.top — it posts its intent and the host decides the URL. On
   latimes.com this same listener would map the intent onto their routes
   (/games/crossword, /games/crossword/2026-08-09, …) instead of play.html. */
addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;              // same-origin in this harness
  const d = e.data;
  if (!d || d.source !== 'lat-games' || d.event !== 'navigate') return;
  const { id } = resolveGame(d.gameId);
  const q = new URLSearchParams({ game: id });
  if (d.puzzleId) q.set('p', d.puzzleId);
  if (d.difficulty) q.set('d', d.difficulty);
  location.href = 'play.html?' + q.toString();
});
</script>
</body>
</html>
